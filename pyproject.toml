[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-day-trader"
version = "0.1.0"
description = "NSE cash-equity intraday research and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
india-trader = "india_trader.cli:main"

[tool.setuptools.packages.find]
include = ["india_trader*"]

[tool.setuptools.package-data]
india_trader = ["calendars/*.json"]
